# Cache-Regel je Pfad. Steht als Variable hier statt als add_header in den locations: nginx erbt add_header nur in
# locations ohne eigenes add_header – so gelten die Sicherheits-Header unten überall. Leerer Wert = kein Header
# (/api: das Backend setzt „no-store“ selbst).
map $uri $cockpit_cache_control {
  ~^/assets/ "public, max-age=31536000, immutable";
  ~^/api/    "";
  default    "no-cache";
}

# Zugriffsprotokoll ohne Query und Referer: `?q=` enthält z. B. gesuchte Namen von Leads.
log_format cockpit '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent '
                   '$request_time "$http_user_agent"';

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  access_log /var/log/nginx/access.log cockpit;
  server_tokens off;

  # Echte Client-IP (Begrenzung der Login-Versuche): X-Forwarded-For nur übernehmen, wenn die Anfrage aus einem
  # privaten Netz kommt – das ist Caddy im Docker-Netz. Caddy schickt genau eine Adresse (die des Browsers); davon gilt
  # der letzte Eintrag. Wer direkt auf den Port des Frontends zugreift (öffentliche IP), kann so nichts vortäuschen:
  # Dann zählt seine eigene Adresse. Im Heimnetz ohne Caddy (WEB_BIND=8080) gilt: Geräte im selben privaten Netz
  # könnten eine Adresse vortäuschen – dort ist das Netz selbst die Grenze.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  set_real_ip_from fc00::/7;
  real_ip_header X-Forwarded-For;
  real_ip_recursive off;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Sicherheits-Header (auch in vite.config.ts → preview, damit die E2E-Tests mit derselben CSP laufen).
  # Skripte nur von hier (kein eingeschleuster Code), keine Einbettung in fremde Seiten (Klickbetrug), Referer bleibt
  # auf der eigenen Seite. HSTS wirkt nur über HTTPS (Caddy); über http (Heimnetz) ignorieren Browser es.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header Cache-Control $cockpit_cache_control;

  # Backend der Lead-Suche (eigener Container im selben Compose-Netz)
  location /api/ {
    # Adresse des Backends bei jeder Anfrage neu auflösen (Docker-DNS): Nach einem Update bekommt der neu gestartete
    # Backend-Container oft eine neue IP – mit fester Adresse käme sonst bis zum Neustart von nginx nur 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8787;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Genau eine, geprüfte Client-IP (siehe realip oben) – nie eine mitgeschickte Kette anhängen. Das Backend vertraut
    # nur nginx (ein Proxy).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    # Server-Sent Events: nicht puffern, lange offen halten
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    # Upload der Tracking-Liste (Excel)
    client_max_body_size 20m;
  }

  # Gehashte Build-Dateien dürfen lange gecacht werden (Cache-Control oben über die map)
  location /assets/ {
    try_files $uri =404;
  }

  # Single-Page-App: alles andere auf index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
