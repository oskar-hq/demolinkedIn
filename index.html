<!doctype html>
<html lang="de" translate="no">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- viewport-fit=cover: Als Web-App auf dem Home-Bildschirm reicht die Seite bis unter Notch und Home-Indikator;
         die Abstände regeln --safe-* in src/index.css. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0c" />
    <!-- „Zum Home-Bildschirm“: eigenes Fenster ohne Safari-Leisten, dunkle Statusleiste über der Seite. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cockpit" />
    <meta name="format-detection" content="telephone=no" />
    <!-- Keine automatische Übersetzung: Chrome ersetzt sonst Text, und React verliert den Überblick (schwarzer Bildschirm). -->
    <meta name="google" content="notranslate" />
    <title>Outreach Cockpit</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
